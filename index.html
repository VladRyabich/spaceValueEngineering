<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceValueEngineering</title>
    <!-- Normalize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/table-styles.css" />
    <link rel="stylesheet" href="./css/desktop-styles.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header_con">
        <a class="header_logo" href="./index.html">
          <svg class="header_logo_icon" width="64" height="64">
            <use href="/images/icon.svg#logo-icon"></use>
          </svg>
          SpaceValueEngineering
        </a>

        <nav class="nav">
          <ul class="nav_list">
            <li class="nav_item">
              <a class="nav_item_link" href="#home">Home</a>
            </li>
            <li class="nav_item">
              <a class="nav_item_link" href="#about">About</a>
            </li>
            <li class="nav_item">
              <a class="nav_item_link" href="#services">Services</a>
            </li>
            <li class="nav_item">
              <a class="nav_item_link" href="#whysve">Why SVE</a>
            </li>
          </ul>
        </nav>

        <button class="touch_btn" type="button" data-modal-open>
          Get in Touch
        </button>

        <button
          type="button"
          class="burger_btn"
          data-menu-open
          aria-label="open menu"
        >
          <svg class="burger_icon" width="24" height="24">
            <use href="./images/icons.svg#icon-mobile_burger-menu-1"></use>
          </svg>
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main">
      <section class="hero">
        <div class="hero_con">
          <!-- Спільний контейнер-обгортка для точного позиціонування -->
          <div class="comparison-container">
            <!-- Сам слайдер (на нього накладається маска) -->
            <div class="comparison" id="comparison">
              <!-- AFTER -->
              <div class="comparison_wrapper">
                <img
                  src="/images/after-house.jpg"
                  alt="After"
                  class="comparison__image comparison__image--after"
                />
                <div class="comparison__label comparison__label--after">
                  AFTER
                </div>
              </div>

              <!-- BEFORE -->
              <div class="comparison_wrapper">
                <img
                  src="/images/before-house.png"
                  alt="Before"
                  class="comparison__image comparison__image--before"
                  id="beforeImage"
                />
                <div class="comparison__label comparison__label--before">
                  BEFORE
                </div>
              </div>

              <!-- VERTICAL LINE & HANDLE -->
              <div class="comparison__line" id="comparisonLine"></div>
              <div
                class="comparison__handle"
                id="comparisonHandle"
                aria-label="Перетягнути порівняння"
              ></div>
            </div>

            <!-- Іконка: позиціонується відносно comparison-container, але поза маскою -->
            <div class="comparions_wrapper_icon">
              <svg class="header_logo_icon comparions_icon">
                <use href="/images/icon.svg#logo-icon"></use>
              </svg>
            </div>
          </div>

          <div class="container">
            <h1 class="hero_title">SpaceValueEngineering</h1>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer"></footer>

    <!-- Mobile menu -->
    <div class="mobile_menu" data-menu>
      <div class="container">
        <button
          type="button"
          class="mobile_menu_close_btn"
          aria-label="close menu"
          data-menu-close
        >
          <svg class="mobile_menu_close_icon" width="8" height="8">
            <use href=""></use>
          </svg>
        </button>

        <nav class="mobile_nav">
          <ul class="mobile_nav_list">
            <li class="mobile_nav_item">
              <a class="mobile_nav_link active" href="#home">Home</a>
            </li>
            <li class="mobile_nav_item">
              <a class="mobile_nav_link" href="#about">About</a>
            </li>
            <li class="mobile_nav_item">
              <a class="mobile_nav_link" href="#services">Services</a>
            </li>
            <li class="mobile_nav_item">
              <a class="mobile_nav_link" href="#whysve">Why SVE</a>
            </li>
          </ul>
        </nav>

        <address>
          <ul class="mobile_address_list">
            <li class="mobile_address_item">
              <!-- <a href="" class="mobile_address_link" data-modal-open>vlad2253@gmail.com</a> -->
            </li>
            <li class="mobile_address_item">
              <a href="tel:+38011111111" class="mobile_address_link"
                >+380 00 0000000</a
              >
            </li>
            <li>
              <a href="mailto:vlad2253@gmail.com" data-mobile-modal
                >vlad2253@gmail.com</a
              >
            </li>
          </ul>
        </address>
      </div>
    </div>

    <!-- Modal form -->
    <div class="backdrop is_hidden" data-modal>
      <div class="modal">
        <!-- Кнопка закриття -->
        <button type="button" class="modal_close_btn" data-modal-close>
          <!-- SVG іконка закриття -->
          <svg width="18" height="18">
            <use href="./images/icons.svg#icon-close"></use>
          </svg>
        </button>

        <p class="modal_title">Залиште свої дані, ми вам передзвонимо</p>

        <form id="form" class="modal_form">
          <!-- Повне ім'я -->
          <div class="form_field">
            <label for="user-name" class="form_label"> Повне ім'я </label>

            <div class="input_wrapper">
              <input
                type="text"
                name="name"
                id="user-name"
                class="form_input _req"
                placeholder="Введіть ваше ім'я"
              />

              <svg class="input_icon" width="18" height="18">
                <use href="./images/icons.svg#icon-person"></use>
              </svg>
            </div>
          </div>

          <!-- Пошта -->
          <div class="form_field">
            <label for="user-email" class="form_label"> Пошта </label>

            <div class="input_wrapper">
              <input
                type="email"
                name="email"
                id="user-email"
                class="form_input _req _email"
                placeholder="example@gmail.com"
              />

              <svg class="input_icon" width="18" height="18">
                <use href="./images/icons.svg#icon-email"></use>
              </svg>
            </div>
          </div>

          <!-- Телефон -->
          <div class="form_field">
            <label for="user-phone" class="form_label"> Телефон </label>

            <div class="input_wrapper">
              <input
                type="tel"
                name="phone"
                id="user-phone"
                class="form_input _req"
                placeholder="+380 (__) ___-__-__"
              />

              <svg class="input_icon" width="18" height="18">
                <use href="./images/icons.svg#icon-phone"></use>
              </svg>
            </div>
          </div>

          <!-- Коментар -->
          <div class="form_field">
            <label for="user-comment" class="form_label"> Коментар </label>

            <textarea
              name="comment"
              id="user-comment"
              rows="5"
              class="form_textarea"
              placeholder="Введіть текст"
            ></textarea>
          </div>

          <!-- Умови конфіденційності -->
          <div class="form_field checkbox-field">
            <input
              type="checkbox"
              name="policy"
              id="privacy-policy"
              class="checkbox_input _req"
            />

            <label for="privacy-policy" class="checkbox_label">
              <span>
                Погоджуюся з
                <a href="#" class="policy_link"> умовами конфіденційності </a>
              </span>
            </label>
          </div>

          <!-- Альтернативний спосіб зв'язку -->
          <div class="callback_option">
            <p class="callback_text">Або зверніться за телефоном</p>

            <a href="tel:+380991234567" class="callback_phone">
              +38 (099) 123-45-67
            </a>
          </div>

          <!-- Кнопка -->
          <button type="submit" class="submit_btn">Відправити</button>
        </form>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="./js/hero-slider.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/modal.js"></script>
  </body>
</html>
